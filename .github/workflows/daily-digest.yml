name: Daily math.PR digest

# Runs entirely on GitHub's infrastructure — no local machine needed.
#  * Fetches/updates digests (generate_digest.py is self-backfilling: it builds
#    any missing week and tops up the in-progress week on every run).
#  * Commits the updated data/ back to the repo (the persistent cache). site/
#    is NOT committed: it is fully rebuilt from data/ on every run, and the live
#    site is served from the uploaded Pages artifact (below), not from the repo —
#    so committing it would only add rebuild churn to git history.
#  * Publishes the freshly built site/ to GitHub Pages over https.

on:
  # Rebuild and republish whenever the code/templates change, so site edits go
  # live immediately instead of waiting for the next scheduled run. data/ is
  # excluded so the job's own digest commits (which only touch data/) don't
  # retrigger it into a loop; the concurrency group below also prevents a
  # push-triggered run from overlapping a scheduled one.
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    # 02:00 UTC, Monday–Friday — shortly after arXiv has announced its latest
    # batch. arXiv announces new submissions at 20:00 US Eastern on Sun–Thu
    # evenings (none Fri/Sat ET), which lands at 00:00 UTC (EDT) / 01:00 UTC
    # (EST) the next day — i.e. Mon–Fri in UTC. 02:00 UTC clears the latest
    # landing time with an hour to spare and works in both DST regimes. Each run
    # tops up the in-progress Mon–Sun week; the generator freezes a week once its
    # grace window has passed, so daily runs stay idempotent.
    #
    # Minute is offset from the top of the hour (:17 rather than :00): GitHub's
    # scheduler is heavily oversubscribed at exact hour boundaries, so on-the-hour
    # crons are frequently delayed or dropped under load. An off-hour minute is
    # far more likely to fire on time.
    - cron: '17 2 * * 1-5'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

# Action versions below are pinned to Node 24-native majors, so nothing relies on
# the deprecated Node 20 runtime (GitHub removes it from runners 2026-09-16).

# Allow the job to commit data back and to deploy Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs (e.g. a manual run during a scheduled one) clash.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate / update digests and rebuild site
        run: python3 generate_digest.py

      - name: Commit updated digests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only data/ is the persistent cache; site/ is rebuilt each run and
          # served from the Pages artifact, so it is intentionally not committed.
          git add data
          if git diff --cached --quiet; then
            echo "No digest changes this run."
          else
            git commit -m "Digest update — $(date -u +%Y-%m-%d)"
            # Another commit (e.g. a merge to main) may land between checkout and
            # push, which would reject a bare push as non-fast-forward. Rebase our
            # data/ commit onto the latest main and retry. The intervening commit
            # can even be another run's own digest commit (a "Re-run" checks out
            # the run's original SHA, so its regenerated week files collide with
            # data already pushed since), so a plain rebase can hit content
            # conflicts in data/. -X theirs resolves them in favour of the commit
            # being replayed — i.e. this run's freshly fetched data, which is the
            # newer of the two.
            pushed=
            for attempt in 1 2 3 4 5; do
              if git push; then
                pushed=1
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing on origin/main"
              git pull --rebase -X theirs origin main
              sleep $((attempt * 2))
            done
            [ -n "$pushed" ] || { echo "could not push digest data after 5 attempts"; exit 1; }
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
