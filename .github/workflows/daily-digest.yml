name: Daily math.PR digest

# Runs entirely on GitHub's infrastructure — no local machine needed.
#  * Fetches/updates digests (generate_digest.py is self-backfilling: it builds
#    any missing week and tops up the in-progress week on every run).
#  * Commits the updated data/ back to the repo (the persistent cache). site/
#    is NOT committed: it is fully rebuilt from data/ on every run, and the live
#    site is served from the uploaded Pages artifact (below), not from the repo —
#    so committing it would only add rebuild churn to git history.
#  * Publishes the freshly built site/ to GitHub Pages over https.

on:
  schedule:
    # 02:00 UTC, Monday–Friday — shortly after arXiv has announced its latest
    # batch. arXiv announces new submissions at 20:00 US Eastern on Sun–Thu
    # evenings (none Fri/Sat ET), which lands at 00:00 UTC (EDT) / 01:00 UTC
    # (EST) the next day — i.e. Mon–Fri in UTC. 02:00 UTC clears the latest
    # landing time with an hour to spare and works in both DST regimes. Each run
    # tops up the in-progress Mon–Sun week; the generator freezes a week once its
    # grace window has passed, so daily runs stay idempotent.
    - cron: '0 2 * * 1-5'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

# Action versions below are pinned to Node 24-native majors, so nothing relies on
# the deprecated Node 20 runtime (GitHub removes it from runners 2026-09-16).

# Allow the job to commit data back and to deploy Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs (e.g. a manual run during a scheduled one) clash.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate / update digests and rebuild site
        run: python3 generate_digest.py

      - name: Commit updated digests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only data/ is the persistent cache; site/ is rebuilt each run and
          # served from the Pages artifact, so it is intentionally not committed.
          git add data
          if git diff --cached --quiet; then
            echo "No digest changes this run."
          else
            git commit -m "Digest update — $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
