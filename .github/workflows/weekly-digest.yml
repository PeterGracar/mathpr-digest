name: Weekly math.PR digest

# Runs entirely on GitHub's infrastructure — no local machine needed.
#  * Fetches/updates digests (generate_digest.py is self-backfilling: it builds
#    any missing week and tops up the in-progress week).
#  * Commits the updated data/ + site/ back to the repo (the persistent cache).
#  * Publishes site/ to GitHub Pages over https.

on:
  schedule:
    # Saturdays 07:00 UTC (7am GMT). The current Mon–Sun week is captured as a
    # partial digest on Saturday; it is finalised (incl. Sunday's submissions) on
    # the following Saturday's run, which refetches the full week before freezing.
    - cron: '0 7 * * 6'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

# Action versions below are pinned to Node 24-native majors, so nothing relies on
# the deprecated Node 20 runtime (GitHub removes it from runners 2026-09-16).

# Allow the job to commit data back and to deploy Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs (e.g. a manual run during a scheduled one) clash.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate / update digests and rebuild site
        run: python3 generate_digest.py

      - name: Commit updated digests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No digest changes this run."
          else
            git commit -m "Weekly digest update — $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
